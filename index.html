    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. المتغيرات والإعدادات الأساسية
           ========================================= */
        :root {
            --bg-dark: #030712;         /* أسود مزرق فخم */
            --gold-primary: #D4AF37;    /* ذهبي */
            --gold-light: #FDE08B;      /* ذهبي فاتح */
            --gold-dark: #997A00;       /* ذهبي غامق */
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --glass-bg: rgba(17, 24, 39, 0.6);
            --glass-border: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* لمنع السكرول بسبب الأنيميشن */
            position: relative;
        }

        /* =========================================
           2. الخلفية الفخمة المتحركة (CSS Only - Light)
           ========================================= */
        /* إضاءة خلفية ثابتة */
        .ambient-light {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
        }

        /* جزيئات ذهبية متحركة */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-primary);
            opacity: 0.4;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* =========================================
           3. الحاوية الزجاجية الرئيسية
           ========================================= */
        .main-card {
            width: 100%;
            max-width: 850px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
            margin: 20px;
            
            /* أنيميشن دخول الكارت */
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* خط ذهبي متوهج أعلى الكارت */
        .main-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            box-shadow: 0 0 20px var(--gold-primary);
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* تأخير ظهور العناصر الداخلية */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           4. اللوجو (تأثير توهج فخم)
           ========================================= */
        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
        }

        .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            z-index: -1;
            animation: rotateGlow 4s linear infinite;
            filter: blur(8px);
            opacity: 0.6;
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--gold-primary);
            background: #fff;
            padding: 5px;
            transition: transform 0.5s ease;
        }

        .logo-wrapper:hover .logo {
            transform: scale(1.05);
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* =========================================
           5. العناوين (تأثير الذهب المعدني)
           ========================================= */
        .brand-name {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FFF 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* =========================================
           6. قسم "قريباً" (تأثير الكتابة)
           ========================================= */
        .coming-soon-container {
            display: inline-block;
            padding: 12px 35px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            border-radius: 50px;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
        }

        .coming-soon-text {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .typing-text {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--gold-primary);
            animation: typing 3s steps(30, end) infinite alternate, blink 0.8s step-end infinite;
            margin: 0 auto;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* =========================================
           7. كروت الخدمات (Glassmorphism & Hover)
           ========================================= */
        .services-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .service-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .service-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .service-box:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.04);
        }

        .service-box:hover::before {
            opacity: 1;
        }

        /* أيقونات SVG احترافية بدل الإيموجي */
        .service-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px auto;
            fill: var(--gold-primary);
            transition: transform 0.4s ease;
        }

        .service-box:hover .service-icon {
            transform: scale(1.15);
            fill: var(--gold-light);
        }

        .service-name {
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* =========================================
           8. التواصل والزرار
           ========================================= */
        .contact-area {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 30px;
        }

        .delivery-text {
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
            position: relative;
            overflow: hidden;
        }

        .whatsapp-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn:hover::after {
            left: 150%;
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .location {
            margin-top: 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* =========================================
           9. التجاوب مع الشاشات (Responsive)
           ========================================= */
        @media (max-width: 768px) {
            .main-card { padding: 40px 20px; margin: 15px; }
            .brand-name { font-size: 2.5rem; letter-spacing: 3px; }
            .brand-subtitle { font-size: 0.9rem; }
            .services-container { grid-template-columns: repeat(2, 1fr); }
            .coming-soon-text { font-size: 1.2rem; }
            .whatsapp-btn { width: 100%; justify-content: center; }
        }
        @media (max-width: 400px) {
            .services-container { grid-template-columns: 1fr; }
        }
    </style>

    <!-- سكريبت خفيف جداً لتوليد الجزيئات المتحركة -->
    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 30; // عدد الجزيئات (خفيف جداً على المتصفح)

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // أحجام وأماكن وسرعات عشوائية
            const size = Math.random() * 4 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 10; // من 10 لـ 20 ثانية
            const delay = Math.random() * 10;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            particlesContainer.appendChild(particle);
        }
    </script>
